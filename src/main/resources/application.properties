# NovaBank 수신 업무 설정 (2013-11 기준)
app.name=NovaBank
app.branch.code=0917
app.timezone=Asia/Seoul

# 이체 한도(KRW)
transfer.limit.per.tx=50000000
transfer.limit.per.day=100000000
# 이체 수수료: 당행 무료, 타행은 금액 구간별
transfer.fee.other.bank.under.100000=500
transfer.fee.other.bank.under.1000000=800
transfer.fee.other.bank.over=1500
# 영업시간 외(18:00~09:00) 타행 이체 가산 수수료
transfer.fee.after.hours.surcharge=300

# 입출금
withdraw.limit.per.tx=10000000

# 대출 계산기
loan.rate.min.percent=1.0
loan.rate.max.percent=20.0
loan.months.max=480

# 일마감 리포트 스케줄(ms)
close.schedule.fixed.delay=60000
